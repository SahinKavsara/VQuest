
services:
  backend:
    build: ./backend
    container_name: vquest-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/vquest
      - JWT_SECRET=vquest_super_secret_key_12345!@#
      - NODE_ENV=development
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: vquest-frontend
    restart: unless-stopped
    ports:
      - "80:80" # Nginx yayın portu
    depends_on:
      - backend

  mongo:
    image: mongo:latest
    container_name: vquest-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: