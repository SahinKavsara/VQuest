
services:
  backend:
    build: ./backend
    container_name: vquest-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/vquest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=vquest_super_secret_key_12345!@#
      - NODE_ENV=development
      # Redis bağlantı URL'si — redisClient.js bu değişkeni okur
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - mongo
      - redis

  frontend:
    build: ./frontend
    container_name: vquest-frontend
    restart: unless-stopped
    ports:
      - "80:80" # Nginx yayın portu
    depends_on:
      - backend

  mongo:
    image: mongo:latest
    container_name: vquest-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Redis — JWT kara listesi ve rate limiting için
  redis:
    image: redis:7-alpine
    container_name: vquest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Veri kalıcılığı: sunucu yeniden başlatılsa bile kara liste korunur
    volumes:
      - redis-data:/data
    # AOF (Append Only File) ile veri dayanıklılığı
    command: redis-server --appendonly yes

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  # Jenkins — CI/CD pipeline için, Docker socket ile Docker'a erişir
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: vquest-jenkins
    restart: unless-stopped
    ports:
      - "8090:8080"   # 8080 zaten Windows Jenkins'te, çakışmamak için 8090
      - "50000:50000" # Jenkins agent portu
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - jenkins-data:/var/jenkins_home               # Jenkins verisini kalıcı tut
      - /var/run/docker.sock:/var/run/docker.sock    # Docker socket — sh + docker komutları için
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock

volumes:
  mongo-data:
  redis-data:
  jenkins-data:
